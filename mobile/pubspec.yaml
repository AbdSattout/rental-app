name: homio
description: "Appartment rental app."
publish_to: "none"

version: 1.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.3
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  google_maps_flutter: ^2.14.0
  google_maps_flutter_web: ^0.5.5
  google_places_flutter: ^2.1.1
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  hugeicons: ^1.1.2
  skeletonizer: ^2.1.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  smooth_page_indicator: ^2.0.1
  google_fonts: ^6.3.3
  geocoding: ^4.0.0
  photo_view: ^0.15.0
  flutter_svg: ^2.0.10
  syncfusion_flutter_datepicker: ^32.1.20
  pusher_channels_flutter: ^2.4.0
  remixicon: ^1.4.1
  material_symbols_icons: ^4.2892.0
  flutter_chat_ui: ^2.11.1
  flutter_chat_core: ^2.9.0
  flyer_chat_image_message: ^2.3.0
  flyer_chat_file_message: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/stickers/
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria.ttf
    - family: Momo Trust Display
      fonts:
        - asset: assets/fonts/MomoTrustDisplay.ttf
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar.ttf
